<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">NepTLS protocol observability</title><desc id="desc">An animated neon network path showing HTTP and TLS inspection.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06131b"/><stop offset="1" stop-color="#102d45"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#14b8a6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="28" fill="url(#bg)"/><g opacity=".2" stroke="#67e8f9"><path d="M0 85h1200M0 170h1200M0 255h1200M0 340h1200"/><path d="M100 0v420M220 0v420M340 0v420M460 0v420M580 0v420M700 0v420M820 0v420M940 0v420M1060 0v420"/></g><g fill="none" stroke="url(#cyan)" stroke-width="4" filter="url(#glow)"><path d="M160 210h180l85-85h120" stroke-dasharray="12 12"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.4s" repeatCount="indefinite"/></path><path d="M160 210h180l85 85h120" stroke-dasharray="12 12"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.4s" repeatCount="indefinite"/></path></g><g filter="url(#glow)"><circle cx="135" cy="210" r="34" fill="#0f766e" stroke="#5eead4" stroke-width="3"/><path d="M120 210h30M135 195v30" stroke="#ccfbf1" stroke-width="4"/><rect x="545" y="100" width="260" height="220" rx="24" fill="#0a1d2b" stroke="url(#cyan)" stroke-width="4"/><path d="M590 150h170M590 190h130M590 230h155" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/><circle cx="600" cy="278" r="10" fill="#5eead4"><animate attributeName="cx" values="600;750;600" dur="2.5s" repeatCount="indefinite"/></circle></g><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ecfeff"><text x="64" y="80" font-size="25" fill="#5eead4">$ neptls inspect</text><text x="64" y="120" font-size="18">observe the protocol, don't guess</text><text x="64" y="354" font-size="16" fill="#67e8f9">TLS 1.3  •  ALPN h2  •  HTTP/2  •  VERIFIED</text><text x="875" y="175" font-size="22" fill="#99f6e4">NEPTLS</text><text x="875" y="210" font-size="15" fill="#67e8f9">HTTP + TLS toolkit</text><text x="875" y="244" font-size="15" fill="#94a3b8">Python 3.10+ • zero deps</text></g></svg>
