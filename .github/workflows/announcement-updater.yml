name: Announcement updater

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh generated release metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("docs/metrics.json")
          data = json.loads(path.read_text())
          data["announcement_updated_at"] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics.json
          git diff --cached --quiet || git commit -m "chore: refresh announcement metadata"
          git push
